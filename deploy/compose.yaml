services:
  alpha:
    build: ..
    environment:
      KROWMAIL_DOMAIN: alpha.test
      KROWMAIL_SEGMENT_COUNT: "1"
      KROWMAIL_DB: /tmp/mail.sqlite
      KROWMAIL_PUBLIC_ENDPOINT: http://alpha:8080
      KROWMAIL_PEERS: beta.test=http://beta:8080
      KROWMAIL_TRUST_PEERS: "1"
      KROWMAIL_DEBUG_WIRE: "1"
      KROWMAIL_LISTEN: 0.0.0.0:8080
    ports:
      - "19081:8080"
  beta:
    build: ..
    environment:
      KROWMAIL_DOMAIN: beta.test
      KROWMAIL_SEGMENT_COUNT: "1"
      KROWMAIL_DB: /tmp/mail.sqlite
      KROWMAIL_PUBLIC_ENDPOINT: http://beta:8080
      KROWMAIL_PEERS: alpha.test=http://alpha:8080
      KROWMAIL_TRUST_PEERS: "1"
      KROWMAIL_DEBUG_WIRE: "1"
      KROWMAIL_LISTEN: 0.0.0.0:8080
    ports:
      - "19082:8080"
  mcp:
    build: ..
    entrypoint: ["krowmail-mcp"]
    environment:
      KROWMAIL_URL: http://alpha:8080
    profiles: ["tools"]
    stdin_open: true
