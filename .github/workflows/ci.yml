name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || fromJSON(vars.KROW_CI_TABLE || '{}')[format('heavy@{0}{1}', github.event_name, github.event.pull_request.draft && '-draft' || '')] || fromJSON(vars.KROW_CI_TABLE || '{}')['heavy'] || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: python3 scripts/lint_spec.py
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
